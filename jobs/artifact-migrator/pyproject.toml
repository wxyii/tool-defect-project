[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-defect-artifact-migrator"
version = "1.0.0"
description = "P6-01 历史数据导入与不可变基线"
requires-python = ">=3.9,<3.12"
dependencies = [
    "Pillow>=10",
    "numpy>=1.24,<2",
]

[tool.setuptools]
py-modules = ["migrate"]
