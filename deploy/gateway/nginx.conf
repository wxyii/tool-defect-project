worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=control_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;

    upstream business_api {
        server business-api:8080;
        keepalive 32;
    }

    map $ssl_client_verify $mtls_allowed {
        default 0;
        SUCCESS 1;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /run/secrets/gateway-tls.crt;
        ssl_certificate_key /run/secrets/gateway-tls.key;
        ssl_protocols TLSv1.3;
        ssl_client_certificate /run/secrets/device-ca.crt;
        ssl_crl /run/secrets/device-ca.crl;
        ssl_verify_client optional;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(),microphone=(),geolocation=()" always;

        limit_conn per_client 32;
        limit_req zone=control_api burst=40 nodelay;

        location /api/v1/edge/ {
            if ($mtls_allowed = 0) {
                return 403;
            }
            proxy_set_header X-Device-Certificate-Fingerprint $ssl_client_fingerprint;
            proxy_set_header X-Device-Certificate-Subject $ssl_client_s_dn;
            proxy_pass http://business_api;
        }

        location /api/v1/ {
            proxy_pass http://business_api;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 9443 ssl;
        server_name gateway;

        ssl_certificate /run/secrets/gateway-tls.crt;
        ssl_certificate_key /run/secrets/gateway-tls.key;
        ssl_protocols TLSv1.3;
        ssl_client_certificate /run/secrets/service-ca.crt;
        ssl_crl /run/secrets/service-ca.crl;
        ssl_verify_client on;
        ssl_session_tickets off;

        client_max_body_size 2m;
        location /internal/v1/ {
            proxy_set_header X-Service-Certificate-Fingerprint $ssl_client_fingerprint;
            proxy_set_header X-Service-Certificate-Subject $ssl_client_s_dn;
            proxy_pass http://business_api;
        }

        location / {
            return 404;
        }
    }
}
