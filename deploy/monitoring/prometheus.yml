global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: telemetry
    static_configs:
      - targets: ["telemetry:8889"]

  - job_name: business-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["business-api:9091"]

  - job_name: inference-service
    static_configs:
      - targets: ["inference-service:9092"]

  - job_name: edge-agent
    static_configs:
      - targets: ["edge-agent:9100"]
