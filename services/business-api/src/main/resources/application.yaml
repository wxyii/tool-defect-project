spring:
  application:
    name: tool-defect-business-api
  datasource:
    url: ${TD_DATABASE_URL:}
    username: ${TD_DATABASE_USERNAME:}
    password: ${TD_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${TD_DATABASE_POOL_SIZE:10}
      connection-timeout: ${TD_DATABASE_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    validate-migration-naming: true
    clean-disabled: true
  rabbitmq:
    addresses: ${TD_RABBITMQ_ADDRESSES:}
    username: ${TD_RABBITMQ_USERNAME:}
    password: ${TD_RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    ssl:
      enabled: ${TD_RABBITMQ_SSL_ENABLED:true}
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

management:
  server:
    port: ${TD_MANAGEMENT_PORT:9091}
    address: ${TD_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbit:
      enabled: ${td.messaging.enabled:false}

td:
  auth:
    secure-cookie: ${TD_AUTH_SECURE_COOKIE:true}
    bootstrap:
      username: ${TD_BOOTSTRAP_ADMIN_USERNAME:}
      display-name: ${TD_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password-file: ${TD_BOOTSTRAP_ADMIN_PASSWORD_FILE:}
  operations:
    enabled: ${TD_OPERATIONS_ENABLED:false}
    scan-enabled: ${TD_OPERATIONS_SCAN_ENABLED:true}
    scan-batch-size: ${TD_OPERATIONS_SCAN_BATCH_SIZE:100}
    scan-fixed-delay: ${TD_OPERATIONS_SCAN_FIXED_DELAY_MS:60000}
    staging-audit-window: ${TD_STAGING_AUDIT_WINDOW:PT24H}
  telemetry:
    service-version: ${TD_SERVICE_VERSION:unknown}
    environment: ${TD_ENVIRONMENT:unknown}
  review:
    claim-lease: ${TD_REVIEW_CLAIM_LEASE:PT5M}
  detection:
    maximum-attempts: ${TD_DETECTION_MAXIMUM_ATTEMPTS:3}
    retry-delay-1: ${TD_DETECTION_RETRY_DELAY_1:PT30S}
    retry-delay-2: ${TD_DETECTION_RETRY_DELAY_2:PT2M}
    retry-delay-3: ${TD_DETECTION_RETRY_DELAY_3:PT10M}
    policy:
      version: ${TD_DISPOSITION_POLICY_VERSION:auto-policy/1}
      gray-low: ${TD_DISPOSITION_GRAY_LOW:0.45}
      gray-high: ${TD_DISPOSITION_GRAY_HIGH:0.55}
      high-score-threshold: ${TD_DISPOSITION_HIGH_SCORE_THRESHOLD:0.8}
      warning-requires-review: ${TD_DISPOSITION_WARNING_REVIEW:true}
      mask-required-for-unqualified: ${TD_DISPOSITION_MASK_REQUIRED:true}
  messaging:
    enabled: ${TD_MESSAGING_ENABLED:false}
    publisher:
      batch-size: ${TD_OUTBOX_BATCH_SIZE:100}
      claim-lease: ${TD_OUTBOX_CLAIM_LEASE:PT30S}
      confirm-timeout: ${TD_RABBIT_CONFIRM_TIMEOUT:PT10S}
      fixed-delay: ${TD_OUTBOX_FIXED_DELAY:1000}
      maximum-attempts: ${TD_OUTBOX_MAXIMUM_ATTEMPTS:10}
      initial-backoff: ${TD_OUTBOX_INITIAL_BACKOFF:PT1S}
      maximum-backoff: ${TD_OUTBOX_MAXIMUM_BACKOFF:PT5M}
      jitter-ratio: ${TD_OUTBOX_JITTER_RATIO:0.2}
    consumer:
      enabled: ${TD_INBOX_CONSUMER_ENABLED:false}
      queue: ${TD_INBOX_CONSUMER_QUEUE:}
      name: ${TD_INBOX_CONSUMER_NAME:business-api}
      claim-lease: ${TD_INBOX_CLAIM_LEASE:PT30S}
  storage:
    enabled: ${TD_STORAGE_ENABLED:false}
    endpoint: ${TD_S3_ENDPOINT:}
    public-endpoint: ${TD_S3_PUBLIC_ENDPOINT:}
    region: ${TD_S3_REGION:us-east-1}
    access-key: ${TD_S3_ACCESS_KEY:}
    secret-key: ${TD_S3_SECRET_KEY:}
    path-style-access: ${TD_S3_PATH_STYLE:true}
    require-tls: ${TD_S3_REQUIRE_TLS:true}
    raw-bucket: ${TD_S3_RAW_BUCKET:td-raw}
    derived-bucket: ${TD_S3_DERIVED_BUCKET:td-derived}
    review-bucket: ${TD_S3_REVIEW_BUCKET:td-review}
    upload-ttl: ${TD_S3_UPLOAD_TTL:PT5M}
    read-ttl: ${TD_S3_READ_TTL:PT5M}
    maximum-pixels: ${TD_IMAGE_MAX_PIXELS:100000000}
    maximum-decoded-bytes: ${TD_IMAGE_MAX_DECODED_BYTES:400000000}
    maximum-object-bytes: ${TD_IMAGE_MAX_OBJECT_BYTES:1073741824}
