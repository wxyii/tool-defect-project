[metadata]
name = tool-defect-project
version = 1.0.0
description = Tool defect classification and segmentation reproduction project

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9,<3.12

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tool-defect = tool_defect.cli:main
